security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    # 1) Define separate hashers for your two entities (Manager and FinanceOfficer).
    #    We remove the old "Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'"
    #    and replace it with explicit references to your entities.
    password_hashers:
        App\Entity\FinanceOfficer: 'auto'
        App\Entity\Users: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # 2) Define a provider for Manager:
        user_provider:
            entity:
                class: App\Entity\Users
                property: email

        # 3) Define a provider for FinanceOfficer:
        finance_officer_provider:
            entity:
                class: App\Entity\FinanceOfficer
                property: email

        # 4) Create a chain provider that checks Manager first, then FinanceOfficer (or vice versa).
        chain_provider:
            chain:
                providers: [user_provider, finance_officer_provider]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true

            # 5) Use the chain provider here, so the firewall checks both Manager and FinanceOfficer
            provider: chain_provider

            custom_authenticator: App\Security\UserAuthenticator
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin/users, roles: ROLE_ADMIN }

        # 1) Allow unauthenticated access to /login and /register
        - { path: ^/(login|register)$, roles: PUBLIC_ACCESS }

        # 2) Independent Age pages require a logged-in user (explicit)
        - { path: ^/independent-age, roles: ROLE_USER }
      # 2) Hub pages require a logged-in user (explicit)
        - { path: ^/hub(?:/|$), roles: ROLE_USER }

        # 3) Everything else (/) requires authentication
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        # In test environment, define minimal workload for password hashing
        password_hashers:
            App\Entity\FinanceOfficer:
                algorithm: auto
                cost: 4      # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

            App\Entity\Users:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
